<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>പ്രൈം പാക്കേജ് – റൂട്ട് പ്ലാനർ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Malayalam:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5ee;--card:#fff;--ink:#12301b;--mut:#5d6d62;--g:#1b6b2f;--gd:#0b3d1c;--gold:#c9a227;--line:#dfe5d8;--hd:#fbfaf3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a13;--card:#17251c;--ink:#e6efe4;--mut:#9db0a2;--g:#4caf63;--gd:#8fd19c;--line:#264031;--hd:#17251c}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Noto Sans Malayalam",system-ui,sans-serif}
header{background:var(--hd);border-bottom:3px solid var(--gold);padding:10px 14px;display:flex;align-items:center;gap:12px}
header img{height:64px;border-radius:8px;background:#fbfbf6}
header h1{font-size:18px;margin:0;color:var(--gd)}header p{margin:0;color:var(--mut);font-size:13px}
main{max-width:860px;margin:0 auto;padding:12px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.tab{flex:1 0 auto;min-width:84px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 10px;font:inherit;cursor:pointer;text-align:center}
.tab b{display:block;font-size:16px}.tab small{color:var(--mut)}
.tab.on{background:var(--g);color:#fff;border-color:var(--g)}.tab.on small{color:#e3f4e6}
.tab.today{outline:2px solid var(--gold)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.stat b{display:block;font-size:18px;color:var(--g)}.stat span{font-size:12px;color:var(--mut)}
.bar{height:8px;background:var(--line);border-radius:5px;overflow:hidden;margin-bottom:10px}.bar i{display:block;height:100%;background:var(--gold)}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tools input,.tools select{flex:1 1 140px}
input,select,button{font:inherit;color:var(--ink)}
input,select{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
.btn{background:var(--g);color:#fff;border:0;border-radius:8px;padding:8px 12px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.alt{background:transparent;color:var(--g);border:1px solid var(--g)}
.btn.red{background:#c62828;color:#fff;border:0}
.add{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px;display:none;gap:6px;flex-wrap:wrap}
.add.show{display:flex}.add input,.add select{flex:1 1 150px}
.card{background:var(--card);border:1px solid var(--line);border-left:5px solid #888;border-radius:10px;padding:10px;margin-bottom:8px}
.card.s-v{border-left-color:#2e7d32}.card.s-o{border-left-color:var(--gold)}.card.s-c{border-left-color:#c62828}.card.s-l{border-left-color:#1565c0}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.nm{font-weight:700}.ph{color:var(--mut);font-size:13px}
.badge{font-size:12px;color:#fff;border-radius:12px;padding:1px 9px;white-space:nowrap}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.row>*{flex:1 1 110px}
.row a.btn,.row button{flex:0 0 auto}
.last{font-size:12px;color:var(--mut);margin-top:4px}
.empty{text-align:center;color:var(--mut);padding:30px}
#pv{display:none}
@media print{body>*:not(#pv){display:none!important}#pv{display:block}body{background:#fff!important;color:#000!important}
#pv table{width:100%;border-collapse:collapse;font-size:11px}#pv th,#pv td{border:1px solid #888;padding:3px 5px;text-align:left}#pv tr{break-inside:avoid}
.phd{display:flex;align-items:center;gap:10px}.phd img{height:54px}#pv:not(.m) h3:not(:first-of-type){break-before:page}}
</style>

<script>
const DAYS=['ശനി','തിങ്കൾ','ചൊവ്വ','ബുധൻ','വ്യാഴം'],JSD=[6,1,2,3,4],WK=['ഞായർ','തിങ്കൾ','ചൊവ്വ','ബുധൻ','വ്യാഴം','വെള്ളി','ശനി'];
const ST={p:['ബാക്കി','#7a7a7a'],v:['സന്ദർശിച്ചു','#2e7d32'],o:['ഓർഡർ ലഭിച്ചു','#b8860b'],c:['കട അടച്ചു','#c62828'],l:['പിന്നീട്','#1565c0']};
const $=i=>document.getElementById(i);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let cfg=ld('pp_cfg',{}),D=ld('pp_data',{shops:[],visits:[]}),Q=ld('pp_q',[]);
if(location.hash.indexOf('#cfg=')===0){try{cfg=JSON.parse(atob(location.hash.slice(5)));sv('pp_cfg',cfg)}catch(e){}history.replaceState(null,'',location.pathname+location.search)}
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const wd=s=>new Date(s+'T00:00:00').getDay();
let date=today(),cur=0;
const pickDay=()=>{const i=JSD.indexOf(wd(date));if(i>=0)cur=i};
pickDay();$('dt').value=date;$('mo').value=date.slice(0,7);
const vis=(dt,id)=>D.visits.find(v=>v.date===dt&&v.id===id);
const done=v=>!!v&&v.s!=='p'&&v.s!=='l';
const nowt=()=>new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
const opts=(o,sel)=>Object.keys(o).map(k=>`<option value="${k}"${k===sel?' selected':''}>${o[k][0]}</option>`).join('');
$('f').innerHTML+=opts(ST,'');
$('ad').innerHTML=DAYS.map((n,i)=>`<option value="${i}">${n}</option>`).join('');
const msg=t=>{$('opmsg').textContent=t};
function setSy(t){$('sy').textContent=t||(!cfg.u?'⚙ സെറ്റപ്പ് ചെയ്യുക':Q.length?'⏳ '+Q.length+' സിങ്ക് ബാക്കി':'✓ ക്ലൗഡ് സിങ്ക് ആയി')}
async function api(a){const r=await fetch(cfg.u,{method:'POST',body:JSON.stringify(Object.assign({key:cfg.k},a))});const j=await r.json();if(j.error)throw new Error(j.error);return j}
const errT=e=>e.message==='auth'?'⚠ പാസ്‌വേഡ് തെറ്റാണ്':'⚠ ഓഫ്‌ലൈൻ – '+Q.length+' ബാക്കി';
let busy=false;
async function flush(){if(busy||!cfg.u)return;busy=true;try{while(Q.length){await api(Q[0]);Q.shift();sv('pp_q',Q)}}catch(e){busy=false;setSy(errT(e));return}busy=false;setSy()}
async function pull(){if(!cfg.u)return;await flush();if(Q.length)return;try{D=await api({a:'read'});sv('pp_data',D);render();setSy()}catch(e){setSy(errT(e))}}
function push(a){Q.push(a);sv('pp_q',Q);sv('pp_data',D);setSy();flush()}
function render(){
 const sh=d=>D.shops.filter(x=>x.d===d),todayI=JSD.indexOf(wd(date));
 $('tabs').innerHTML=DAYS.map((n,i)=>`<button class="tab${i===cur?' on':''}${i===todayI?' today':''}" data-d="${i}"><b>${n}</b><small>${sh(i).filter(x=>done(vis(date,x.id))).length}/${sh(i).length}</small></button>`).join('');
 const all=sh(cur),dn=all.filter(x=>done(vis(date,x.id))).length,ord=all.reduce((a,x)=>a+(+(vis(date,x.id)||{}).o||0),0);
 $('stats').innerHTML=[['ആകെ കടകൾ',all.length],['സന്ദർശിച്ചു',dn],['ബാക്കി',all.length-dn],['ഓർഡർ ₹',ord.toLocaleString('en-IN')]].map(([l,v])=>`<div class="stat"><b>${v}</b><span>${l}</span></div>`).join('');
 $('bar').style.width=(all.length?dn*100/all.length:0)+'%';
 const q=$('q').value.trim().toLowerCase(),f=$('f').value;
 const h=all.map((x,i)=>({x,i:i+1,v:vis(date,x.id)||{s:'p',o:'',t:'',v:''}})).filter(({x,v})=>(!f||v.s===f)&&(!q||(x.n+x.p).toLowerCase().includes(q))).map(({x,i,v})=>{
  const st=ST[v.s],d=String(x.p).replace(/\D/g,''),m=d.length===10&&/^[6-9]/.test(d);
  return `<div class="card s-${v.s}" data-id="${x.id}"><div class="top"><div><div class="nm">${i}. ${esc(x.n)}</div><div class="ph">${esc(x.p)||'ഫോൺ നമ്പർ ഇല്ല'}</div></div><span class="badge" style="background:${st[1]}">${st[0]}</span></div>
  <div class="row">${d?`<a class="btn alt" href="tel:${m?'+91'+d:(d.length===10?'0'+d:d)}">📞 വിളിക്കുക</a>`:''}${m?`<a class="btn" target="_blank" rel="noopener" href="https://wa.me/91${d}">WhatsApp</a>`:''}</div>
  <div class="row"><select data-f="s">${opts(ST,v.s)}</select><input data-f="o" type="number" min="0" inputmode="numeric" placeholder="ഓർഡർ തുക ₹" value="${esc(v.o)}"><input data-f="t" placeholder="കുറിപ്പ്" value="${esc(v.t)}"></div>
  <div class="row"><select data-f="d">${DAYS.map((n,j)=>`<option value="${j}"${j===x.d?' selected':''}>റൂട്ട് മാറ്റുക: ${n}</option>`).join('')}</select><button class="btn alt" data-del="1">ഒഴിവാക്കുക</button></div>
  ${v.v?`<div class="last">സമയം: ${esc(v.v)}</div>`:''}</div>`}).join('');
 $('list').innerHTML=h||'<div class="empty">കടകളൊന്നുമില്ല</div>';
 const t=`*${date} (${DAYS[cur]}) – റൂട്ട് റിപ്പോർട്ട്*%0Aസന്ദർശിച്ചത്: ${dn}/${all.length}%0Aഓർഡർ: ₹${ord}%0A`+all.filter(x=>(vis(date,x.id)||{}).o).map(x=>`• ${x.n}: ₹${vis(date,x.id).o}`).join('%0A');
 $('share').href='https://wa.me/?text='+t.replace(/&/g,'%26').replace(/#/g,'');
}
$('tabs').onclick=e=>{const b=e.target.closest('.tab');if(b){cur=+b.dataset.d;render()}};
$('dt').onchange=e=>{date=e.target.value||today();pickDay();render()};
$('q').oninput=render;$('f').onchange=render;
$('addbtn').onclick=()=>{$('add').classList.toggle('show');$('ad').value=cur};
$('asave').onclick=()=>{const n=$('an').value.trim();if(!n){$('an').focus();return}
 const s={id:Date.now(),n:n,p:$('ap').value.trim(),d:+$('ad').value};D.shops.push(s);cur=s.d;$('an').value='';$('ap').value='';push({a:'shopAdd',shop:s});render()};
$('list').onchange=e=>{const c=e.target.closest('.card'),k=e.target.dataset.f;if(!c||!k)return;const id=+c.dataset.id,x=D.shops.find(y=>y.id===id);
 if(k==='d'){x.d=+e.target.value;push({a:'shopSet',shop:x})}
 else{let v=vis(date,id);if(!v){v={date:date,id:id,s:'p',o:'',t:'',v:''};D.visits.push(v)}
  v[k]=e.target.value;if(k==='s')v.v=v.s==='p'?'':nowt();
  if(v.s==='p'&&!v.o&&!v.t)D.visits=D.visits.filter(y=>y!==v);
  push({a:'visit',v:{date:date,id:id,n:x.n,d:x.d,s:v.s,o:v.o,t:v.t,tm:v.v}})}
 render()};
function arm(b,txt,fn){if(b.dataset.arm){fn();return}const o=b.textContent;b.dataset.arm=1;b.textContent=txt;b.classList.add('red');
 setTimeout(()=>{delete b.dataset.arm;b.textContent=o;b.classList.remove('red')},3000)}
$('list').onclick=e=>{const b=e.target.closest('[data-del]');if(!b)return;const id=+b.closest('.card').dataset.id;
 arm(b,'ഉറപ്പാണോ?',()=>{D.shops=D.shops.filter(y=>y.id!==id);push({a:'shopDel',id:id});render()})};
$('cfgb').onclick=()=>{$('cu').value=cfg.u||'';$('ck').value=cfg.k||'';$('cfg').classList.toggle('show')};
$('cs').onclick=()=>{cfg={u:$('cu').value.trim(),k:$('ck').value.trim()};sv('pp_cfg',cfg);$('cfg').classList.remove('show');setSy();pull()};
$('cm').onclick=()=>{$('cl').value=location.origin+location.pathname+'#cfg='+btoa(JSON.stringify(cfg));$('cl').select()};
const mrows=()=>{const m=$('mo').value||date.slice(0,7),sm=new Map(D.shops.map(x=>[x.id,x]));
 return{m:m,r:D.visits.filter(v=>v.date.startsWith(m)).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0).map(v=>{const s=sm.get(v.id)||{};return Object.assign({},v,{n:s.n||v.n,p:s.p||''})})}};
const add=(wb,n,a,w)=>{const ws=XLSX.utils.aoa_to_sheet(a);ws['!cols']=w.map(x=>({wch:x}));XLSX.utils.book_append_sheet(wb,ws,n)};
$('xl').onclick=()=>{if(typeof XLSX==='undefined'){msg('Excel ലൈബ്രറി ലോഡ് ആയില്ല – ഇന്റർനെറ്റ് പരിശോധിക്കുക');return}
 const {m,r}=mrows(),wb=XLSX.utils.book_new(),by={},sp={};
 r.forEach(v=>{const b=by[v.date]=by[v.date]||{n:0,o:0},q=sp[v.id]=sp[v.id]||{n:v.n,p:v.p,c:0,o:0,l:''};if(done(v)){b.n++;q.c++}b.o+=+v.o||0;q.o+=+v.o||0;q.l=v.date});
 const ks=Object.keys(by).sort(),sm=[['തീയതി','ദിവസം','സന്ദർശിച്ച കടകൾ','ഓർഡർ ₹']].concat(ks.map(k=>[k,WK[wd(k)],by[k].n,by[k].o]));
 sm.push(['ആകെ','',ks.reduce((a,k)=>a+by[k].n,0),ks.reduce((a,k)=>a+by[k].o,0)]);
 add(wb,'സംഗ്രഹം',sm,[12,10,16,12]);
 add(wb,'സന്ദർശനങ്ങൾ',[['തീയതി','ദിവസം','കട','ഫോൺ','സ്റ്റാറ്റസ്','ഓർഡർ ₹','കുറിപ്പ്']].concat(r.map(v=>[v.date,WK[wd(v.date)],v.n,v.p,ST[v.s][0],+v.o||'',v.t])),[12,10,38,14,14,10,24]);
 add(wb,'കടകൾ',[['കട','ഫോൺ','സന്ദർശനം','ഓർഡർ ₹','അവസാന തീയതി']].concat(Object.keys(sp).map(k=>[sp[k].n,sp[k].p,sp[k].c,sp[k].o,sp[k].l])),[38,14,10,12,12]);
 XLSX.writeFile(wb,'route-'+m+'.xlsx');msg('Excel ഫയൽ ഡൗൺലോഡ് ആയി ✓')};
const pvh=t=>`<div class="phd"><img src="${document.querySelector('header img').src}"><h2>${t}</h2></div>`;
const tb=rows=>'<table><tr><th>#</th><th>കട</th><th>ഫോൺ</th><th>സ്റ്റാറ്റസ്</th><th>ഓർഡർ ₹</th><th>കുറിപ്പ്</th></tr>'+rows.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.n)}</td><td>${esc(x.p)}</td><td>${ST[x.s][0]}</td><td>${esc(x.o)}</td><td>${esc(x.t)}</td></tr>`).join('')+'</table>';
function prn(h,cls,name){$('pv').className=cls;$('pv').innerHTML=h;const t=document.title;document.title=name;setTimeout(()=>{window.print();document.title=t},150)}
$('pd1').onclick=()=>prn(pvh(`${DAYS[cur]} – ${date}`)+tb(D.shops.filter(x=>x.d===cur).map(x=>Object.assign({o:'',t:''},vis(date,x.id)||{s:'p'},{n:x.n,p:x.p}))),'','route-'+date);
$('pd2').onclick=()=>{const {m,r}=mrows();let h=pvh('മാസ റിപ്പോർട്ട് – '+m);
 [...new Set(r.map(v=>v.date))].forEach(k=>{const a=r.filter(v=>v.date===k);h+=`<h3>${k} (${WK[wd(k)]}) – സന്ദർശിച്ചത് ${a.filter(done).length} – ഓർഡർ ₹${a.reduce((t,x)=>t+(+x.o||0),0)}</h3>`+tb(a)});
 if(!r.length)h+='<p>ഈ മാസം രേഖകളൊന്നുമില്ല</p>';prn(h,'m','route-'+m)};
window.addEventListener('online',pull);
render();setSy();if(!cfg.u)$('cfg').classList.add('show');pull();
</script>
</body>
</html>
